name: Build Windows x86

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Configure Windows x86
        run: >
          cmake -S . -B build/ci-windows-x86 -A Win32
          -DSAORS_BUILD_ASI=ON
          -DSAORS_BUILD_TESTS=ON
          -DSAORS_BUILD_STREAM_PROBE=ON
          -DSAORS_ENABLE_LIBVLC=OFF
          -DSAORS_ENABLE_NETWORK_TESTS=OFF
          -DSAORS_ENABLE_WARNINGS_AS_ERRORS=ON

      - name: Build
        run: cmake --build build/ci-windows-x86 --config Release --parallel

      - name: Test
        run: ctest --test-dir build/ci-windows-x86 -C Release --output-on-failure

      - name: Smoke test null-backend stream probe
        run: build/ci-windows-x86/bin/Release/saors_stream_probe.exe --help

      - name: Upload ASI
        uses: actions/upload-artifact@v7
        with:
          name: SAORSForGTA3-windows-x86
          path: build/ci-windows-x86/bin/Release/SAORSForGTA3.asi
          if-no-files-found: error
