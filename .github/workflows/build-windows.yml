name: Build Windows x86

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Configure Windows x86
        run: >
          cmake --preset windows-msvc-x86-release
          -DSAORS_ENABLE_WARNINGS_AS_ERRORS=ON

      - name: Build
        run: cmake --build --preset windows-msvc-x86-release

      - name: Test
        run: ctest --preset windows-msvc-x86-release

      - name: Upload ASI
        uses: actions/upload-artifact@v7
        with:
          name: SAORSForGTA3-windows-x86
          path: build/windows-msvc-x86-release/bin/Release/SAORSForGTA3.asi
          if-no-files-found: error
