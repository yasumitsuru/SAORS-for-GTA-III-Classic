name: Build Windows x86

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Configure Windows x86
        run: >
          cmake -S . -B build/ci-windows-x86 -A Win32
          -DSAORS_BUILD_ASI=ON
          -DSAORS_BUILD_TESTS=ON
          -DSAORS_BUILD_STREAM_PROBE=ON
          -DSAORS_BUILD_EXE_PROBE=ON
          -DSAORS_ENABLE_LIBVLC=OFF
          -DSAORS_ENABLE_NETWORK_TESTS=OFF
          -DSAORS_ENABLE_PLUGIN_SDK=OFF
          -DSAORS_FETCH_PLUGIN_SDK=OFF
          -DSAORS_ENABLE_EXPERIMENTAL_GAME_OBSERVER=OFF
          -DSAORS_ENABLE_RADIO_CONTROLLER_DRY_RUN=OFF
          -DSAORS_ENABLE_GAMEPLAY_STREAM_EXECUTOR=OFF
          -DSAORS_ENABLE_WARNINGS_AS_ERRORS=ON

      - name: Build
        run: cmake --build build/ci-windows-x86 --config Release --parallel

      - name: Test
        run: ctest --test-dir build/ci-windows-x86 -C Release --output-on-failure

      - name: Smoke test null-backend stream probe
        run: build/ci-windows-x86/bin/Release/saors_stream_probe.exe --help

      - name: Smoke test executable probe CLI
        run: build/ci-windows-x86/bin/Release/saors_exe_probe.exe --help

      - name: Upload Windows x86 artifacts
        uses: actions/upload-artifact@v7
        with:
          name: SAORSForGTA3-windows-x86
          path: |
            build/ci-windows-x86/bin/Release/SAORSForGTA3.asi
            build/ci-windows-x86/bin/Release/saors_stream_probe.exe
            build/ci-windows-x86/bin/Release/saors_exe_probe.exe
          if-no-files-found: error

  plugin-sdk:
    name: ${{ matrix.name }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: plugin-sdk compile probe
            build: ci-plugin-sdk-x86
            observer: OFF
            controller: OFF
          - name: experimental observer and controller dry-run
            build: ci-observer-x86
            observer: ON
            controller: ON

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Configure pinned plugin-sdk mode
        run: >
          cmake -S . -B build/${{ matrix.build }} -A Win32
          -DSAORS_BUILD_ASI=ON
          -DSAORS_BUILD_TESTS=ON
          -DSAORS_BUILD_STREAM_PROBE=OFF
          -DSAORS_BUILD_EXE_PROBE=ON
          -DSAORS_ENABLE_LIBVLC=OFF
          -DSAORS_ENABLE_NETWORK_TESTS=OFF
          -DSAORS_ENABLE_PLUGIN_SDK=ON
          -DSAORS_FETCH_PLUGIN_SDK=ON
          -DSAORS_ENABLE_EXPERIMENTAL_GAME_OBSERVER=${{ matrix.observer }}
          -DSAORS_ENABLE_RADIO_CONTROLLER_DRY_RUN=${{ matrix.controller }}
          -DSAORS_ENABLE_GAMEPLAY_STREAM_EXECUTOR=OFF
          -DSAORS_ENABLE_WARNINGS_AS_ERRORS=ON

      - name: Build
        run: cmake --build build/${{ matrix.build }} --config Release --parallel

      - name: Run offline tests
        run: ctest --test-dir build/${{ matrix.build }} -C Release --output-on-failure

      - name: Record safety scope
        shell: pwsh
        run: |
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value @"
          ## Experimental observer and controller CI scope

          - plugin-sdk is fetched at the exact revision pinned by CMake
          - the job compiles Windows x86 code and runs synthetic offline tests
          - no game executable is present
          - no hook is installed and no network or audio playback is started
          - the gameplay stream executor remains disabled in this offline CI job
          "@
