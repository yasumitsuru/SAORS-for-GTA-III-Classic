name: Build Linux MinGW Windows x86

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test-host:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Configure native host tests
        run: >
          cmake -S . -B build/host-tests -G Ninja
          -DSAORS_BUILD_ASI=OFF
          -DSAORS_BUILD_TESTS=ON
          -DSAORS_BUILD_STREAM_PROBE=ON
          -DSAORS_BUILD_EXE_PROBE=OFF
          -DSAORS_ENABLE_LIBVLC=OFF
          -DSAORS_ENABLE_NETWORK_TESTS=OFF
          -DSAORS_ENABLE_PLUGIN_SDK=OFF
          -DSAORS_FETCH_PLUGIN_SDK=OFF
          -DSAORS_ENABLE_EXPERIMENTAL_GAME_OBSERVER=OFF
          -DSAORS_ENABLE_RADIO_CONTROLLER_DRY_RUN=OFF
          -DSAORS_ENABLE_GAMEPLAY_STREAM_EXECUTOR=OFF
          -DSAORS_ENABLE_WARNINGS_AS_ERRORS=ON

      - name: Build native host tests
        run: cmake --build build/host-tests

      - name: Run native host tests
        run: ctest --test-dir build/host-tests --output-on-failure

      - name: Smoke test null-backend stream probe
        run: build/host-tests/bin/saors_stream_probe --help

  cross-build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Install MinGW-w64 x86 toolchain
        run: |
          sudo apt-get update
          sudo apt-get install --yes ninja-build g++-mingw-w64-i686

      - name: Configure Windows x86 cross-build
        run: >
          cmake --preset linux-mingw-x86-release
          -DSAORS_BUILD_STREAM_PROBE=ON
          -DSAORS_BUILD_EXE_PROBE=ON
          -DSAORS_ENABLE_LIBVLC=OFF
          -DSAORS_ENABLE_NETWORK_TESTS=OFF
          -DSAORS_ENABLE_PLUGIN_SDK=OFF
          -DSAORS_FETCH_PLUGIN_SDK=OFF
          -DSAORS_ENABLE_EXPERIMENTAL_GAME_OBSERVER=OFF
          -DSAORS_ENABLE_RADIO_CONTROLLER_DRY_RUN=OFF
          -DSAORS_ENABLE_GAMEPLAY_STREAM_EXECUTOR=OFF
          -DSAORS_ENABLE_WARNINGS_AS_ERRORS=ON

      - name: Build Windows x86 ASI
        run: cmake --build --preset linux-mingw-x86-release

      - name: Inspect PE artifact
        run: |
          file build/linux-mingw-x86-release/bin/SAORSForGTA3.asi
          file build/linux-mingw-x86-release/bin/saors_stream_probe.exe
          file build/linux-mingw-x86-release/bin/saors_exe_probe.exe

      - name: Upload Windows x86 artifacts
        uses: actions/upload-artifact@v7
        with:
          name: SAORSForGTA3-mingw-x86
          path: |
            build/linux-mingw-x86-release/bin/SAORSForGTA3.asi
            build/linux-mingw-x86-release/bin/saors_stream_probe.exe
            build/linux-mingw-x86-release/bin/saors_exe_probe.exe
          if-no-files-found: error
