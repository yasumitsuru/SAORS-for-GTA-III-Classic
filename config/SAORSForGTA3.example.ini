; Copy this file next to SAORSForGTA3.asi and rename it to SAORSForGTA3.ini.
; The game-state observer is experimental, read-only, and disabled by default.

[General]
Enabled=true
BufferMilliseconds=3000
Reconnect=true
ReconnectDelayMilliseconds=5000
ResolveRemotePlaylists=true
PlaylistConnectTimeoutMilliseconds=5000
PlaylistReceiveTimeoutMilliseconds=10000
PlaylistMaximumBytes=262144
PlaylistMaximumEntries=128
PlaylistMaximumRedirects=5
PlaylistMaximumDepth=3
VolumeMultiplier=1.0
LogLevel=info

[Experimental]
EnableGameObserver=false
ObserverDryRun=true
LogStateTransitions=true
EnableRadioController=false
RadioControllerDryRun=true
LogRadioDecisions=true
; Requires a build with SAORS_ENABLE_GAMEPLAY_STREAM_EXECUTOR=ON plus libVLC.
EnableGameplayAudioExecutor=false
; Also requires SAORS_ENABLE_ORIGINAL_RADIO_SUPPRESSION=ON and a validated mechanism.
; No production mechanism is currently available, so this remains fail-closed.
MuteOriginalRadioDuringGameplayAudio=false

[Station.HeadRadio]
Enabled=true
Name=Rádio Central DJ
URL=https://www.centraldj.com.br/radios/centraldj/stream.m3u
; The resolved media uses unencrypted HTTP. Enable only when that risk is accepted.
AllowHttp=true
; GameStationRaw must be set only after local validation.
; GameStationIdentity=riseFm is an alternative exact-profile dry-run binding.
; Do not set GameStationRaw and GameStationIdentity in the same station.

[Station.DoubleClef]
Enabled=false
Name=Classical Online
URL=https://example.com/classical.mp3
AllowHttp=false

[Research]
EnableRadioStationMapRecorder=false
RadioStationMinimumStableFrames=15
LogRadioStationObservations=false
